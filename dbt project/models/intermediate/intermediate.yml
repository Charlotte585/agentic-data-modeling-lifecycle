version: 2

models:
  - name: int_ad_events_identity_resolved
    description: >-
      Resolves each ad interaction event to the visitor identity-history record
      valid at the event timestamp. The model retains one row per ad interaction
      event and uses a left temporal join with half-open identity windows [start,
      end), so events without a valid identity-history record remain visible.
      A valid anonymous record is a successful temporal match but is not a
      resolved customer; an unmatched event has no valid identity record.
    columns:
      - name: event_id
        description: Primary key for the ad interaction event.
        data_tests:
          - not_null
          - unique
      - name: event_timestamp
        description: Timestamp when the ad interaction occurred.
      - name: event_type
        description: Normalized interaction type emitted by the behavioral source.
      - name: visitor_id
        description: Source visitor identifier associated with the event.
      - name: campaign_id
        description: Source campaign identifier carried by the event.
      - name: ad_id
        description: Source advertisement identifier carried by the event.
      - name: creative_id
        description: Source creative identifier carried by the event.
      - name: placement_id
        description: Source placement identifier where the event occurred.
      - name: device_type
        description: Normalized device type associated with the event.
      - name: customer_id
        description: Customer identifier from the identity record valid at event time; null for anonymous or unmatched events.
      - name: account_id
        description: Account identifier from the identity record valid at event time; null for anonymous or unmatched events.
      - name: identity_type
        description: Event-time identity classification; null when no identity record matched.
      - name: account_status
        description: Event-time account status for a verified customer; null for anonymous or unmatched events.
      - name: identity_effective_from_timestamp
        description: Inclusive start timestamp of the identity-history record matched to the event.
      - name: identity_effective_to_timestamp
        description: Exclusive end timestamp of the identity-history record matched to the event.
      - name: identity_record_matched_flag
        description: >-
          True when an identity-history record was valid for the visitor at event
          time. This is true for valid anonymous records and false for unmatched
          events.
      - name: identity_resolved_flag
        description: >-
          True only when the event-time identity is a verified customer with both
          customer_id and account_id. This is false for valid anonymous records
          and unmatched events.

  - name: int_ad_events_enriched
    description: >-
      One row per ad event from int_ad_events_identity_resolved, with all event
      and resolved identity fields passed through unchanged. Left joins
      stg_ad_metadata on ad_id and event_timestamp within the half-open ad
      version window [start, end), using UTC timestamps from staging. Events
      without a valid ad version remain visible with null metadata and a false
      match flag. Paused and inactive versions are retained. Source campaign_id
      and creative_id are not overwritten; version-specific IDs have separate
      names. Valid, non-overlapping ad windows are enforced upstream; invalid
      history fails tests rather than being silently deduplicated here.
    columns:
      - name: event_id
        description: Primary key inherited from the identity-resolved event.
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        description: Source campaign ID from the event, unchanged by enrichment.
      - name: creative_id
        description: Source creative ID from the event, unchanged by enrichment.
      - name: ad_name
        description: Advertisement name from the version valid at event time; null when unmatched.
      - name: ad_metadata_campaign_id
        description: Campaign ID assigned to the matched ad version; may differ from the event campaign_id.
      - name: ad_metadata_creative_id
        description: Creative ID assigned to the matched ad version; may differ from the event creative_id.
      - name: creative_name
        description: Creative name from the matched ad version; null when unmatched.
      - name: marketing_channel
        description: Marketing channel from the matched ad version; null when unmatched.
      - name: ad_status
        description: Delivery status from the matched ad version, including paused or inactive; null when unmatched.
      - name: ad_version_start_timestamp
        description: Inclusive start of the matched ad version; null when unmatched.
      - name: ad_version_end_timestamp
        description: Exclusive end of the matched ad version; current versions retain 9999-12-31; null when unmatched.
      - name: ad_metadata_matched_flag
        description: True when an ad version is valid at event time; independent of identity resolution and ad status.
        data_tests:
          - not_null
